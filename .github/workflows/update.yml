name: Sync Market Rates

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-rates
  cancel-in-progress: true

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Rates Ingestion Engine
        run: python sync.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "Suffergod"
          git config --global user.email "suffergod@gmail.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No rate changes detected."
          else
            git commit -m "chore(rates): update live market rates [skip ci]"
            git push origin main
          fi
